<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Art Scene - Gói Con Tim Làm Quà</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background-color: #0d0f18; color: #fff; display: flex; flex-direction: column;
      align-items: center; justify-content: center; min-height: 100vh;
      font-family: 'Press Start 2P', monospace; padding: 16px; overflow-x: hidden;
    }
    .scene-container {
      position: relative; width: 100%; max-width: 480px; aspect-ratio: 9 / 11;
      border: 3px solid #232936; border-radius: 12px; overflow: hidden;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.7); background: #000;
    }
    canvas {
      width: 100%; height: 100%; display: block;
      image-rendering: pixelated; image-rendering: crisp-edges;
    }
    .controls-panel {
      width: 100%; max-width: 480px; margin-top: 14px; display: flex; flex-direction: column;
      gap: 10px; background: #161922; border: 1px solid #2b3245; border-radius: 8px; padding: 12px 16px;
    }
    .progress-row { display: flex; align-items: center; gap: 12px; font-size: 10px; color: #8da0b6; }
    .progress-bar {
      flex: 1; height: 6px; background: #252c3d; border-radius: 3px; position: relative; cursor: pointer;
    }
    .progress-fill { height: 100%; width: 0%; background: #ff5277; border-radius: 3px; pointer-events: none; }
    .btn-row { display: flex; justify-content: space-between; align-items: center; }
    .btn {
      background: #252b3d; border: 1px solid #3d4763; color: #fff; padding: 8px 12px;
      font-size: 9px; font-family: inherit; border-radius: 4px; cursor: pointer; transition: all 0.15s ease;
    }
    .btn:hover { background: #343c55; border-color: #ff5277; }
    .btn:active { transform: translateY(1px); }
  </style>
</head>
<body>

  <div class="scene-container">
    <canvas id="pixelCanvas" width="240" height="290"></canvas>
  </div>

  <div class="controls-panel">
    <div class="progress-row">
      <span id="curTime">00:00</span>
      <div class="progress-bar" id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <span>01:48</span>
    </div>
    <div class="btn-row">
      <button class="btn" id="btnPlay">▶ PHÁT</button>
      <button class="btn" id="btnRestart">↺ LÀM LẠI</button>
      <button class="btn" id="btnSound">🔊 NHẠC: BẬT</button>
    </div>
  </div>

  <!-- Cập nhật tên file thành tên video/audio của bạn -->
  <audio id="bgMusic" src="goi-con-tim-full1.mp3" preload="auto"></audio>

  <script>
    const canvas = document.getElementById('pixelCanvas');
    const ctx = canvas.getContext('2d');
    const W = canvas.width;
    const H = canvas.height;

    const DURATION = 108.0; // Tổng thời lượng bản full (1 phút 48 giây)
    let currentTime = 0;
    let isPlaying = false; 
    let soundEnabled = true;
    let lastStamp = performance.now();
    const bgMusic = document.getElementById('bgMusic');

    // Dữ liệu lời thoại được ánh xạ khớp hoàn toàn với bản nhạc 1:48s
    const dialogues = [
      { start: 5.0, end: 15.0, target: 'male', text: 'bầu trời đêm nay đẹp quá' },
      { start: 23.0, end: 32.0, target: 'male', text: 'anh đã chờ em rất lâu...' },
      { start: 34.0, end: 44.0, target: 'female', text: 'qua bao mùa thay lá...' },
      { start: 46.0, end: 54.0, target: 'male', text: 'cho anh ở bên em nhé?' },
      { start: 55.0, end: 62.0, target: 'male', text: 'em cười đẹp lắm' },
      { start: 63.0, end: 69.0, target: 'male', text: 'em đồng ý nhé?' },
      { start: 70.0, end: 73.0, target: 'female', text: 'em cho nhành hoa' },
      { start: 73.0, end: 77.0, target: 'male', text: 'anh gói tim làm quà' },
      { start: 77.0, end: 84.0, target: 'male', text: 'sợ hoa tàn mất...' },
      { start: 85.0, end: 92.0, target: 'male', text: 'về đây với anh' },
      { start: 93.0, end: 97.0, target: 'male', text: 'mãi mãi nhé?' },
      { start: 97.0, end: 108.0, target: 'female', text: 'ừ, em đồng ý ♡' }
    ];

    const stars = Array.from({ length: 40 }, () => ({
      x: Math.floor(Math.random() * W),
      y: Math.floor(Math.random() * (H - 85)),
      twinkleSpeed: 0.8 + Math.random() * 2.5,
      offset: Math.random() * 10
    }));

    const hearts = Array.from({ length: 30 }, () => ({
      spawnTime: 85 + Math.random() * 15, // Trái tim bắt đầu bay sau giây 85 (lúc ôm nhau)
      xOff: (Math.random() - 0.5) * 36,
      speed: 10 + Math.random() * 14,
      scale: Math.random() > 0.4 ? 1 : 1.5,
      phase: Math.random() * 6
    }));

    function drawPixelMoon(cx, cy, r) {
      ctx.fillStyle = '#f6f6f6';
      for (let y = -r; y <= r; y++) {
        for (let x = -r; x <= r; x++) {
          if (x * x + y * y <= r * r) ctx.fillRect(cx + x, cy + y, 1, 1);
        }
      }
      ctx.fillStyle = '#d0d4da';
      ctx.fillRect(cx - 3, cy - 2, 2, 2); ctx.fillRect(cx + 2, cy + 3, 3, 2); ctx.fillRect(cx + 3, cy - 4, 2, 2);
    }

    function drawPixelFlower(x, y) {
      ctx.fillStyle = '#3ca346'; ctx.fillRect(x, y, 2, 8); ctx.fillRect(x - 2, y + 3, 2, 2);
      ctx.fillStyle = '#ffde59'; ctx.fillRect(x - 2, y - 4, 6, 4); ctx.fillRect(x - 4, y - 2, 10, 2);
      ctx.fillStyle = '#ff4d4d'; ctx.fillRect(x, y - 3, 2, 2);
    }

    function drawPixelHeart(x, y, scale = 1) {
      ctx.fillStyle = '#ff3366';
      const s = scale;
      [[1,2], [2,2], [4,2], [5,2], [0,3], [1,3], [2,3], [3,3], [4,3], [5,3], [6,3],
       [0,4], [1,4], [2,4], [3,4], [4,4], [5,4], [6,4], [1,5], [2,5], [3,5], [4,5], [5,5],
       [2,6], [3,6], [4,6], [3,7]].forEach(([px, py]) => ctx.fillRect(x + px * s, y + py * s, s, s));
    }

    function drawMaleCharacter(x, y) {
      ctx.fillStyle = '#3c79e6'; ctx.fillRect(x + 10, y - 7, 10, 4); ctx.fillRect(x + 8, y - 3, 14, 3);
      ctx.fillStyle = '#f05454'; ctx.fillRect(x + 6, y, 18, 5); ctx.fillRect(x + 2, y + 5, 26, 11);
      ctx.fillStyle = '#ffffff'; ctx.fillRect(x + 9, y + 7, 3, 4); ctx.fillRect(x + 18, y + 7, 3, 4);
      ctx.fillStyle = '#111111'; ctx.fillRect(x + 10, y + 9, 2, 2); ctx.fillRect(x + 19, y + 9, 2, 2);
      ctx.fillStyle = '#c73a3a'; ctx.fillRect(x + 8, y + 16, 4, 4); ctx.fillRect(x + 18, y + 16, 4, 4);
    }

    function drawFemaleCharacter(x, y) {
      ctx.fillStyle = '#ffde59'; ctx.fillRect(x + 10, y - 5, 4, 3); ctx.fillRect(x + 16, y - 5, 4, 3);
      ctx.fillStyle = '#ff9900'; ctx.fillRect(x + 13, y - 4, 4, 3);
      ctx.fillStyle = '#f898b8'; ctx.fillRect(x + 6, y, 18, 5); ctx.fillRect(x + 2, y + 5, 26, 11);
      ctx.fillStyle = '#ff6b9d'; ctx.fillRect(x + 5, y + 10, 3, 2); ctx.fillRect(x + 22, y + 10, 3, 2);
      ctx.fillStyle = '#ffffff'; ctx.fillRect(x + 9, y + 7, 3, 4); ctx.fillRect(x + 18, y + 7, 3, 4);
      ctx.fillStyle = '#111111'; ctx.fillRect(x + 9, y + 9, 2, 2); ctx.fillRect(x + 18, y + 9, 2, 2);
      ctx.fillStyle = '#dc7699'; ctx.fillRect(x + 8, y + 16, 4, 4); ctx.fillRect(x + 18, y + 16, 4, 4);
    }

    function drawCoupleEmbrace(x, y) {
      ctx.fillStyle = '#3c79e6'; ctx.fillRect(x + 4, y - 7, 8, 4); ctx.fillRect(x + 2, y - 3, 12, 3);
      ctx.fillStyle = '#f05454'; ctx.fillRect(x - 2, y, 22, 16);
      ctx.fillStyle = '#ffde59'; ctx.fillRect(x + 24, y - 5, 4, 3); ctx.fillRect(x + 30, y - 5, 4, 3);
      ctx.fillStyle = '#ff9900'; ctx.fillRect(x + 27, y - 4, 4, 3);
      ctx.fillStyle = '#f898b8'; ctx.fillRect(x + 18, y, 22, 16);
      ctx.fillStyle = '#111111'; ctx.fillRect(x + 4, y + 8, 3, 1); ctx.fillRect(x + 11, y + 8, 3, 1);
      ctx.fillRect(x + 24, y + 8, 3, 1); ctx.fillRect(x + 31, y + 8, 3, 1);
      ctx.fillStyle = '#ff5487'; ctx.fillRect(x + 22, y + 11, 3, 2); ctx.fillRect(x + 34, y + 11, 3, 2);
      ctx.fillStyle = '#c73a3a'; ctx.fillRect(x + 2, y + 16, 4, 4); ctx.fillRect(x + 10, y + 16, 4, 4);
      ctx.fillStyle = '#dc7699'; ctx.fillRect(x + 24, y + 16, 4, 4); ctx.fillRect(x + 32, y + 16, 4, 4);
    }

    function drawPixelSpeechBubble(bx, by, text, flipTail = false) {
      ctx.font = '8px "Press Start 2P", monospace';
      const textMetrics = ctx.measureText(text);
      const bw = Math.max(textMetrics.width + 12, 36);
      const bh = 18;
      const x = Math.floor(bx - bw / 2); const y = Math.floor(by - bh);
      ctx.fillStyle = '#ffffff'; ctx.fillRect(x, y, bw, bh);
      if (!flipTail) {
        ctx.fillRect(bx - 3, y + bh, 6, 2); ctx.fillRect(bx - 1, y + bh + 2, 2, 2);
      } else {
        ctx.fillRect(bx - 1, y + bh, 4, 2); ctx.fillRect(bx + 1, y + bh + 2, 2, 2);
      }
      ctx.fillStyle = '#000000'; ctx.strokeRect(x, y, bw, bh);
      ctx.fillStyle = '#222222'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(text, bx, y + bh / 2 + 1);
    }

    function render(time) {
      ctx.fillStyle = '#05070c'; ctx.fillRect(0, 0, W, H);
      stars.forEach(st => {
        const flicker = Math.sin(time * st.twinkleSpeed + st.offset);
        if (flicker > -0.2) {
          ctx.fillStyle = flicker > 0.6 ? '#ffffff' : '#7285a5';
          ctx.fillRect(st.x, st.y, 1, 1);
        }
      });
      drawPixelMoon(195, 36, 12);
      
      const groundY = H - 65;
      ctx.fillStyle = '#143126'; ctx.fillRect(0, groundY, W, H - groundY);
      ctx.fillStyle = '#1e4838';
      for (let x = 0; x < W; x += 12) {
        ctx.fillRect(x + 2, groundY, 4, 3); ctx.fillRect(x + 8, groundY + 1, 3, 2);
      }
      ctx.fillStyle = '#0c2018'; ctx.fillRect(0, groundY + 8, W, 2);
      ctx.fillStyle = '#0f291f'; ctx.fillRect(10, groundY - 14, 8, 14); ctx.fillRect(8, groundY - 10, 12, 10); ctx.fillRect(W - 22, groundY - 12, 8, 12);

      const groundLevel = groundY - 20;
      const bob = Math.round(Math.sin(time * 5) * 1.5);
      
      // Chuyển động xích lại gần nhau khớp với đoạn nhạc chậm ban đầu
      let maleX = 30, femaleX = 180;
      if (time > 30 && time <= 70) {
        const p = (time - 30) / 40;
        maleX = 30 + p * 66;
        femaleX = 180 - p * 66;
      } else if (time > 70) {
        maleX = 96; femaleX = 114;
      }

      const isEmbracing = time >= 85.0; // Ôm nhau ở giây thứ 85

      if (!isEmbracing) {
        drawMaleCharacter(Math.round(maleX), groundLevel + bob);
        drawFemaleCharacter(Math.round(femaleX), groundLevel - bob);
        if (time >= 70 && time < 73) drawPixelFlower(femaleX - 6, groundLevel - 4);
        if (time >= 73 && time < 85) drawPixelFlower(maleX + 24, groundLevel - 2);
      } else {
        drawCoupleEmbrace(Math.round(maleX), groundLevel + bob);
      }

      if (time >= 85) {
        hearts.forEach(h => {
          if (time >= h.spawnTime) {
            const age = (time - h.spawnTime) % 6;
            const hy = groundLevel - 10 - age * h.speed;
            const hx = (W / 2 - 4) + h.xOff + Math.sin(age * 3 + h.phase) * 5;
            if (hy > 10) drawPixelHeart(Math.round(hx), Math.round(hy), h.scale);
          }
        });
      }

      const curDial = dialogues.find(d => time >= d.start && time < d.end);
      if (curDial) {
        let bx = isEmbracing ? W / 2 : (curDial.target === 'male' ? maleX + 14 : femaleX + 14);
        let by = groundLevel - 24 + bob;
        drawPixelSpeechBubble(Math.round(bx), Math.round(by), curDial.text, curDial.target === 'female');
      }
    }

    function tick(now) {
      const dt = (now - lastStamp) / 1000;
      lastStamp = now;
      if (isPlaying) {
        if (soundEnabled && bgMusic.readyState > 0 && !bgMusic.paused) {
          currentTime = bgMusic.currentTime;
        } else {
          currentTime += dt;
        }
        if (currentTime >= DURATION) {
          currentTime = 0; bgMusic.currentTime = 0; bgMusic.pause();
          isPlaying = false; btnPlay.innerText = '▶ PHÁT';
        }
      }
      render(currentTime); updateUI(); requestAnimationFrame(tick);
    }

    const curTimeEl = document.getElementById('curTime');
    const progressFill = document.getElementById('progressFill');
    const progressBar = document.getElementById('progressBar');
    const btnPlay = document.getElementById('btnPlay');
    const btnRestart = document.getElementById('btnRestart');
    const btnSound = document.getElementById('btnSound');

    function updateUI() {
      const mins = Math.floor(currentTime / 60); const secs = Math.floor(currentTime % 60);
      curTimeEl.innerText = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      progressFill.style.width = `${Math.min(100, (currentTime / DURATION) * 100)}%`;
    }

    btnPlay.addEventListener('click', () => {
      isPlaying = !isPlaying;
      btnPlay.innerText = isPlaying ? '⏸ TẠM DỪNG' : '▶ PHÁT';
      isPlaying ? (soundEnabled && bgMusic.play()) : bgMusic.pause();
    });

    btnRestart.addEventListener('click', () => {
      currentTime = 0; bgMusic.currentTime = 0; isPlaying = true;
      btnPlay.innerText = '⏸ TẠM DỪNG'; if (soundEnabled) bgMusic.play();
    });

    btnSound.addEventListener('click', () => {
      soundEnabled = !soundEnabled; bgMusic.muted = !soundEnabled;
      btnSound.innerText = soundEnabled ? '🔊 NHẠC: BẬT' : '🔇 NHẠC: TẮT';
    });

    progressBar.addEventListener('click', (e) => {
      const rect = progressBar.getBoundingClientRect();
      currentTime = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width)) * DURATION;
      bgMusic.currentTime = currentTime;
    });

    requestAnimationFrame(tick);
  </script>
</body>
</html>
